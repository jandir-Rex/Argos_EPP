<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<title>ARGOS EPP — Cámara del celular</title>
<style>
@font-face{font-family:"Archivo";src:url(/static/fonts/archivo.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
*{box-sizing:border-box;margin:0}
body{font:400 16px/1.5 "Archivo",system-ui,sans-serif;background:#0E1A2B;color:#E8EEF6;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
h1{font-size:26px;font-weight:700;font-stretch:76%;margin-bottom:4px}
h1 b{color:#FF6B1A}
.sub{color:#8FA3BC;margin-bottom:18px}
.box{background:#16283F;border-radius:14px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:5px;font-weight:600;font-size:14px}
input{font:inherit;padding:12px;border-radius:9px;border:1px solid #32506F;background:#0E1A2B;color:#fff;width:100%}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:14px;background:#FF6B1A;color:#fff;cursor:pointer}
button.sec{background:#22384F}
button:disabled{opacity:.5}
.vid{position:relative;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh;width:100%}
video{width:100%;height:100%;object-fit:cover;display:block}
.live{position:absolute;top:10px;left:10px;background:#000a;padding:4px 11px;border-radius:99px;font-size:13px;font-weight:600;display:flex;gap:7px;align-items:center}
.live i{width:9px;height:9px;border-radius:50%;background:#8FA3BC}
.live.ok i{background:#12B76A}.live.bad i{background:#E5383B}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{margin-bottom:12px;background:#4A1D22;color:#FFC9CB;padding:12px 14px;border-radius:10px}
.note{color:#8FA3BC;font-size:13.5px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>ARGOS <b>EPP</b></h1>
<p class="sub">Usa este celular como cámara de seguridad.</p>

<div id="err" class="err" hidden></div>

<div class="box" id="setup">
  <label>Zona <input id="zona" maxlength="40" placeholder="Ej. Pabellón 2"></label>
  <label>Nombre del dispositivo <input id="nombre" maxlength="40" placeholder="Ej. Celular de Jandir"></label>
  <button id="go">Iniciar transmisión</button>
  <p class="note">El navegador te pedirá permiso para usar la cámara. Mantén esta pantalla abierta mientras transmites.</p>
</div>

<div id="run" hidden style="display:grid;gap:12px">
  <div class="vid"><video id="v" playsinline muted autoplay></video>
    <div class="live" id="live"><i></i><span id="ltxt">Conectando…</span></div></div>
  <div class="row"><button class="sec" id="flip">Cambiar cámara</button><button class="sec" id="stop">Detener</button></div>
  <p class="note" id="info"></p>
</div>

<script src="/static/camara.js"></script>
</body>
</html>
